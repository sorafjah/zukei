<script>
/*GEN-START*/
// ===== 問題を作る部分（画面や印刷とは分けてあるので、ほかのアプリにそのまま写せる） =====
var rnd=Math.random;
function ri(a,b){return a+Math.floor(rnd()*(b-a+1));}
function pick(a){return a[ri(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=ri(0,i);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function bl(pre,post,n){return pre+'（'+'　'.repeat(Math.round((n||4)*1.75))+'）'+post;}
var SEL='1つ{選|えら}び、（　）に○を{書|か}いてください。';
var TAIL='（1）〜（3）の{問題|もんだい}に{答|こた}えてください。';
var RT='{立方体|りっぽうたい}',TK='{展開図|てんかいず}',MEN='{面|めん}',SR='{印|しるし}',MK='{向|む}かい{合|あ}う';
var SYMS=['●','○','◎','■','□','×'];
var POS=['U','D','N','S','E','W'],OPP={U:'D',D:'U',N:'S',S:'N',E:'W',W:'E'};
function nth(k){return '{左|ひだり}から'+(k+1)+'{番目|ばんめ}';}

// ---- 図（SVG。長さの単位はmm） ----
function svg(w,h,body){w=Math.round(w*100)/100;h=Math.round(h*100)/100;
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="0 0 '+w+' '+h+'">'+body+'</svg>';}
function f2(v){return Math.round(v*100)/100;}
// 印。1×1のマスの中にかき、matrix で面の形に合わせる（どの印も、90度回しても同じ形）
function symU(s){
  if(s==='●')return '<circle cx=".5" cy=".5" r=".27"/>';
  if(s==='○')return '<circle cx=".5" cy=".5" r=".25" fill="none" stroke="#000" stroke-width=".07"/>';
  if(s==='◎')return '<circle cx=".5" cy=".5" r=".28" fill="none" stroke="#000" stroke-width=".06"/><circle cx=".5" cy=".5" r=".13" fill="none" stroke="#000" stroke-width=".06"/>';
  if(s==='■')return '<rect x=".26" y=".26" width=".48" height=".48"/>';
  if(s==='□')return '<rect x=".27" y=".27" width=".46" height=".46" fill="none" stroke="#000" stroke-width=".07"/>';
  if(s==='×')return '<path d="M.27 .27L.73 .73M.73 .27L.27 .73" stroke="#000" stroke-width=".09" fill="none"/>';
  return '';
}
function symAt(s,m){return s?'<g transform="matrix('+m.map(f2).join(' ')+')">'+symU(s)+'</g>':'';}
// 立方体の見取図（上・手前・右の3つの面が見える）
function cubeSVG(t,s){
  var d=s*0.5,p=0.4,W=s+d+2*p,H=s+d+2*p,L='stroke="#000" stroke-width=".4" stroke-linejoin="round" fill="#fff"';
  var b='<g transform="translate('+p+' '+p+')">'
    +'<path d="M0 '+f2(d)+'L'+f2(d)+' 0L'+f2(s+d)+' 0L'+s+' '+f2(d)+'Z" '+L+'/>'
    +'<path d="M'+s+' '+f2(d)+'L'+f2(s+d)+' 0L'+f2(s+d)+' '+s+'L'+s+' '+f2(s+d)+'Z" '+L+'/>'
    +'<rect x="0" y="'+f2(d)+'" width="'+s+'" height="'+s+'" '+L+'/>'
    +symAt(t[0],[s,0,-d,d,d,0])+symAt(t[1],[s,0,0,s,0,d])+symAt(t[2],[d,-d,0,s,s,d])+'</g>';
  return svg(W,H,b);
}
// 展開図（cells:[[x,y],…]、symOf:マスごとの印。なければ白い面）
function netSVG(cells,u,symOf){
  var W=0,H=0,p=0.4,b='';cells.forEach(function(c){W=Math.max(W,c[0]+1);H=Math.max(H,c[1]+1);});
  cells.forEach(function(c,i){var x=p+c[0]*u,y=p+c[1]*u;
    b+='<rect x="'+f2(x)+'" y="'+f2(y)+'" width="'+u+'" height="'+u+'" fill="#fff" stroke="#000" stroke-width=".4"/>';
    if(symOf)b+=symAt(symOf[i],[u,0,0,u,x,y]);});
  return svg(W*u+2*p,H*u+2*p,b);
}

// ---- 立方体のしくみ ----
// 6マスの形をすべて作り、立方体になるもの（NETS・11種類）と、ならないもの（NON）に分ける
function normC(cs){var mx=1e9,my=1e9;cs.forEach(function(c){mx=Math.min(mx,c[0]);my=Math.min(my,c[1]);});
  return cs.map(function(c){return [c[0]-mx,c[1]-my];}).sort(function(a,b){return a[1]-b[1]||a[0]-b[0];});}
function keyC(cs){return cs.map(function(c){return c[0]+','+c[1];}).join(';');}
function variants(cs){var out=[],seen={};
  for(var f=0;f<2;f++)for(var r=0;r<4;r++){
    var v=normC(cs.map(function(c){var x=f?-c[0]:c[0],y=c[1],t;for(var i=0;i<r;i++){t=x;x=-y;y=t;}return [x,y];}));
    var k=keyC(v);if(!seen[k]){seen[k]=1;out.push(v);}}
  return out;}
var D4=[[1,0],[-1,0],[0,1],[0,-1]];
// 展開図を組み立てる：base の面を上（U）にして、ほかの面を下へ折る。画面の上が奥（N）、右がE
function fold(cells,base){
  var idx={},res=[],q=[[base,{h:'U',e:'E',w:'W',n:'N',s:'S',o:'D'}]];cells.forEach(function(c,i){idx[c[0]+','+c[1]]=i;});
  res[base]='U';
  while(q.length){var cur=q.shift(),c=cells[cur[0]],F=cur[1];
    [[1,0,{h:F.e,e:F.o,w:F.h,o:F.w,n:F.n,s:F.s}],[-1,0,{h:F.w,w:F.o,e:F.h,o:F.e,n:F.n,s:F.s}],
     [0,-1,{h:F.n,n:F.o,s:F.h,o:F.s,e:F.e,w:F.w}],[0,1,{h:F.s,s:F.o,n:F.h,o:F.n,e:F.e,w:F.w}]].forEach(function(m){
      var j=idx[(c[0]+m[0])+','+(c[1]+m[1])];if(j===undefined||res[j])return;res[j]=m[2].h;q.push([j,m[2]]);});}
  return res;}
function isNet(cells){var r=fold(cells,0),o={};return r.every(function(p){if(o[p])return false;o[p]=1;return true;});}
var NETS=[],NON=[];
(function(){
  var cur=[[[0,0]]];
  for(var n=2;n<=6;n++){var nx=[],seen={};
    cur.forEach(function(cs){var has={};cs.forEach(function(c){has[c[0]+','+c[1]]=1;});
      cs.forEach(function(c){D4.forEach(function(d){var x=c[0]+d[0],y=c[1]+d[1];if(has[x+','+y])return;
        var v=normC(cs.concat([[x,y]])),k=variants(v).map(keyC).sort()[0];if(!seen[k]){seen[k]=1;nx.push(v);}});});});
    cur=nx;}
  cur.forEach(function(cs){(isNet(cs)?NETS:NON).push(cs);});
})();
function bbox(cs){var W=0,H=0;cs.forEach(function(c){W=Math.max(W,c[0]+1);H=Math.max(H,c[1]+1);});return [W,H];}
// 横長の向きで、回したりうら返したりしたものを1つ選ぶ
function orient(cs){return pick(variants(cs).filter(function(v){var b=bbox(v);return b[0]>=b[1];}));}
function is141(cs){var b=bbox(cs).sort();if(b[0]!==3||b[1]!==4)return false;
  return variants(cs).some(function(v){return bbox(v)[0]===4&&v.filter(function(c){return c[1]===1;}).length===4;});}
// 立方体の向き24通り（位置→位置）
var ROTS=(function(){
  var yaw={U:'U',D:'D',N:'E',E:'S',S:'W',W:'N'},pit={U:'N',N:'D',D:'S',S:'U',E:'E',W:'W'},id={},out=[],seen={},q;
  POS.forEach(function(p){id[p]=p;});q=[id];
  while(q.length){var r=q.shift(),k=POS.map(function(p){return r[p];}).join('');if(seen[k])continue;seen[k]=1;out.push(r);
    [yaw,pit].forEach(function(g){var n={};POS.forEach(function(p){n[p]=g[r[p]];});q.push(n);});}
  return out;})();
function randCube(){var s=shuffle(SYMS),o={};POS.forEach(function(p,i){o[p]=s[i];});return o;}
function oppSym(st,s){var r='';POS.forEach(function(p){if(st[p]===s)r=st[OPP[p]];});return r;}
function pairsText(st){return [['U','D'],['S','N'],['E','W']].map(function(p){return st[p[0]]+'と'+st[p[1]];}).join('、');}
// 見える3つの面（上・手前・右）
function view(st,r){return [st[r.U],st[r.S],st[r.E]];}
// たおして転がす（E:右、W:左、N:奥、S:手前）
function roll(st,d){
  var m={E:['E','U','W','D'],W:['W','U','E','D'],N:['N','U','S','D'],S:['S','U','N','D']}[d],n={};
  POS.forEach(function(p){n[p]=st[p];});
  n.D=st[m[0]];n[m[0]]=st[m[1]];n.U=st[m[2]];n[m[2]]=st[m[3]];return n;}
// 印つきの展開図を作る
function symNet(st,only141){
  var cs=orient(pick(NETS.filter(function(n){return !only141||is141(n);}))),pos=fold(cs,ri(0,5));
  return {cells:cs,pos:pos,syms:pos.map(function(p){return st[p];})};}

// ---- ジャンル1：展開図 ----
function genTenkai(L){
  var st=randCube(),net=symNet(st,L===1),qs=[],ans=[],i,k;
  // (1) 向かい合う面
  var tg=pick(SYMS),op=oppSym(st,tg);
  qs.push({t:'{上|うえ}の'+TK+'を{組|く}み{立|た}てたとき、'+tg+'の'+MEN+'と'+MK+MEN+'の'+SR+'を{書|か}いてください。',a:bl('','',3)});
  ans.push({a:op,w:MK+MEN+'の'+SR+'は、'+pairsText(st)+'です。'});
  // (2) 立方体になる展開図
  var good=orient(pick(NETS.filter(function(n){return L>1||is141(n);}))),bads=shuffle(NON.filter(function(n){var b=bbox(n);return Math.max(b[0],b[1])<=4;})).slice(0,2).map(orient);
  var list=shuffle([{c:good,ok:1},{c:bads[0]},{c:bads[1]}]);k=0;list.forEach(function(x,j){if(x.ok)k=j;});
  qs.push({t:'{組|く}み{立|た}てると'+RT+'になる'+TK+'を、{次|つぎ}の3つから'+SEL,figs:list.map(function(x){return netSVG(x.c,8);})});
  ans.push({a:nth(k),w:'ほかの2つは、{組|く}み{立|た}てると'+MEN+'が{重|かさ}なって、'+RT+'になりません。'});
  // (3) 組み立てた立方体を選ぶ
  var ok=view(st,pick(ROTS)),ws=[],why=[],guard=0;
  function wOpp(){var v=view(st,pick(ROTS)),a=ri(0,2),b=(a+ri(1,2))%3;v[a]=oppSym(st,v[b]);return {v:v,w:v[a]+'と'+v[b]+'は'+MK+MEN+'なので、となりにはなりません。'};}
  function wMir(){var v=view(st,pick(ROTS));return {v:[v[0],v[2],v[1]],w:MEN+'のならび{方|かた}が、{反対|はんたい}{回|まわ}りです。'};}
  while(ws.length<2&&guard++<50){var w=(L===3&&ws.length===0)?wMir():wOpp(),key=w.v.join('');
    if(key===ok.join('')||ws.some(function(x){return x.v.join('')===key;}))continue;ws.push(w);}
  if(ws.length<2)return null;
  list=shuffle([{v:ok,ok:1},ws[0],ws[1]]);list.forEach(function(x,j){if(x.ok)k=j;else why.push(nth(j)+'：'+x.w);});
  qs.push({t:'{上|うえ}の'+TK+'を{組|く}み{立|た}てると、どの'+RT+'になりますか。{次|つぎ}の3つから'+SEL,figs:list.map(function(x){return cubeSVG(x.v,15);})});
  ans.push({a:nth(k),w:why.join('<br>')});
  return {genre:TK,lead:'{下|した}の{図|ず}は、'+RT+'の'+TK+'です。6つの'+MEN+'に、'+SR+'がかいてあります。'+TAIL,
    figs:[{svg:netSVG(net.cells,12,net.syms)}],qs:qs,ans:ans};
}

// ---- ジャンル2：立方体を転がす ----
var DIRV={E:[1,0],W:[-1,0],N:[0,-1],S:[0,1]};

// ---- ジャンル3：カードのまい数 ----
var TRI={bl:['W','S'],br:['E','S'],tl:['W','N'],tr:['E','N']};
var SIDE={E:[1,0,'W'],W:[-1,0,'E'],N:[0,-1,'S'],S:[0,1,'N']};
// カードをならべて形を作る。kind：sq（正方形）dom（長方形）ell（L字）tri（三角形）
function makeShape(kind,n,h,MW,MH){
  var occ={},pieces=[],tri={},cnt=0,tries=0;
  function fits(cs){var a=Object.keys(occ).map(function(k){return k.split(',').map(Number);}).concat(Object.keys(tri).map(function(k){return k.split(',').map(Number);})).concat(cs),b=bbox(normC(a));return b[0]<=MW&&b[1]<=MH;}
  function empty(c){var k=c[0]+','+c[1];return !occ[k]&&!tri[k];}
  function add(cs){cs.forEach(function(c){occ[c[0]+','+c[1]]=pieces.length+1;});pieces.push(cs);}
  var per=kind==='dom'?2:kind==='ell'?3:1;
  add(per===1?[[0,0]]:per===2?[[0,0],pick([[1,0],[0,1]])]:shuffle([[0,0],[1,0],[0,1],[1,1]]).slice(0,3));
  while(pieces.length<n&&tries++<600){
    var base=pick(pick(pieces)),d=pick(D4),a=[base[0]+d[0],base[1]+d[1]],cs;
    if(per===1)cs=[a];
    else if(per===2){var d2=pick(D4);cs=[a,[a[0]+d2[0],a[1]+d2[1]]];}
    else{var ox=a[0]-ri(0,1),oy=a[1]-ri(0,1),four=[[ox,oy],[ox+1,oy],[ox,oy+1],[ox+1,oy+1]],rest=four.filter(function(c){return c[0]!==a[0]||c[1]!==a[1];});
      cs=[a].concat(shuffle(rest).slice(0,2));
      if(cs[1][0]!==a[0]&&cs[1][1]!==a[1]&&cs[2][0]!==a[0]&&cs[2][1]!==a[1])continue;
      if(cs[1][0]!==cs[2][0]&&cs[1][1]!==cs[2][1]&&!((cs[1][0]===a[0]||cs[1][1]===a[1])&&(cs[2][0]===a[0]||cs[2][1]===a[1])))continue;}
    if(!cs.every(empty)||!fits(cs))continue;add(cs);}
  if(pieces.length<n)return null;
  tries=0;
  while(cnt<h&&tries++<300){
    var b2=pick(pick(pieces)),sd=pick(['E','W','N','S']),v=SIDE[sd],c=[b2[0]+v[0],b2[1]+v[1]];
    if(!empty(c)||!fits([c]))continue;
    tri[c[0]+','+c[1]]=pick(Object.keys(TRI).filter(function(t){return TRI[t].indexOf(v[2])>=0;}));cnt++;}
  if(cnt<h)return null;
  // 左上をそろえる
  var all=Object.keys(occ).concat(Object.keys(tri)).map(function(k){return k.split(',').map(Number);}),mx=1e9,my=1e9,W=0,H=0;
  all.forEach(function(c){mx=Math.min(mx,c[0]);my=Math.min(my,c[1]);});
  var o2={},t2={};Object.keys(occ).forEach(function(k){var c=k.split(',');o2[(c[0]-mx)+','+(c[1]-my)]=occ[k];});
  Object.keys(tri).forEach(function(k){var c=k.split(',');t2[(c[0]-mx)+','+(c[1]-my)]=tri[k];});
  all.forEach(function(c){W=Math.max(W,c[0]-mx+1);H=Math.max(H,c[1]-my+1);});

  for(var y=0;y<H;y++)for(var x=0;x<W;x++){var k=x+','+y;if(!o2[k]&&!t2[k]&&!seen[k])return null;}
  return {W:W,H:H,occ:o2,tri:t2,kind:kind,count:kind==='tri'?2*n+h:n};

// 形の図。mode：grid（マスの線）dots（点だけ）div（カードの分け方＝答え）

  var hyp='';

    var pts=Object.keys(P).filter(function(q){return q!==om;}).map(function(q){return X(P[q][0])+','+X(P[q][1]);}).join(' ');

  if(mode==='dots')for(y=0;y<=s.H;y++)for(x=0;x<=s.W;x++)b+='<circle cx="'+X(x)+'" cy="'+X(y)+'" r=".32" fill="#444"/>';

var CARD={

function group(el,opts,key){
  el.innerHTML='';opts.forEach(function(o){var b=document.createElement('button');b.innerHTML=R(o[1]);if(S[key]===o[0])b.className='on';
    b.addEventListener('click',function(){S[key]=o[0];save();group(el,opts,key);build();});el.appendChild(b);});
}
function stepper(el,key,min,max){
  el.innerHTML='<button aria-label="へらす">▽</button><input type="number" inputmode="numeric" min="'+min+'" max="'+max+'"><button aria-label="ふやす">△</button>';
  var inp=el.querySelector('input'),bs=el.querySelectorAll('button');inp.value=S[key];
  function set(v){v=Math.max(min,Math.min(max,Math.round(v)||min));S[key]=v;inp.value=v;save();build();}
  bs[0].addEventListener('click',function(){set(S[key]-1);});bs[1].addEventListener('click',function(){set(S[key]+1);});
  inp.addEventListener('change',function(){set(+inp.value);});
}
